<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#2a0d12" />
<title>Zesto — Food experience, delivered</title>
<style>
  :root{
    --red:#C1272D;--red-deep:#9E1F26;--red-soft:#f7e7df;--red-tint:#f1d8cd;
    --ink:#171719;--sub:#71717a;--line:#eeeef1;--field:#f5f5f7;
    --green:#12924a;--amber:#e8a13a;--poppy:#ffd21f;--poppy-bg:#fff8d6;--card:#fff;
    --gold:#b8862f;--gold-2:#dcc07f;--ivory:#fbf6ec;--maroon:#7a1523;
    --saffron:#E8801C;--saffron-soft:#fdeccd;--marigold:#F5A623;--marigold-soft:#fef3d4;--peacock:#0C6B8F;--peacock-soft:#dcecf1;--peacock-deep:#08556E;--terracotta:#BC5A3C;--terracotta-soft:#f4e2d9;
    --shadow:0 6px 24px rgba(0,0,0,.08);--shadow-lg:0 14px 40px rgba(0,0,0,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow-x:hidden}
  body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:#fff;color:var(--ink);display:flex;justify-content:center}
  #phone{width:100%;max-width:100%;background:#fff;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
  #mktticker{flex:none;background:linear-gradient(90deg,#2a0d12,#3a1119);color:#f3e7d2;height:28px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;font-size:11.5px;font-family:'Segoe UI',system-ui,sans-serif;border-bottom:1px solid var(--gold);z-index:20}
  #mktticker .mk-track{display:inline-block;padding-left:100%;animation:mkscroll 62s linear infinite}
  #mktticker .bmi-tag{color:var(--gold-2);font-weight:700;letter-spacing:1px}
  #mktticker .bmi-em{color:#ffd9a0;font-style:italic}
  #mktticker b{color:#ffe3b8;font-weight:700}
  @keyframes mkscroll{to{transform:translateX(-100%)}}
  @media(min-width:600px){body{background:#0c0c0e;align-items:center;padding:16px}#phone{max-width:430px;height:900px;min-height:0;border-radius:38px;box-shadow:var(--shadow-lg);border:10px solid #0c0c0e}}
  .screen{flex:1;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .screen::-webkit-scrollbar{display:none}
  button{font-family:inherit;border:none;cursor:pointer}
  .btn{width:100%;background:linear-gradient(135deg,var(--saffron),var(--terracotta));color:#fff;border-radius:14px;padding:16px;font-size:15px;font-weight:600;letter-spacing:.2px;box-shadow:0 6px 18px rgba(188,90,60,.32)}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{background:#e4cbbd;box-shadow:none}
  .btn-outline{background:#fff;color:var(--peacock);border:1.5px solid var(--peacock);box-shadow:none}
  .field{width:100%;background:var(--field);border:1px solid transparent;border-radius:12px;padding:14px 15px;font-size:15px}
  .field:focus{outline:none;border-color:var(--peacock);background:#fff}
  .pill{display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;background:var(--field);color:var(--sub)}
  .row{display:flex;align-items:center;justify-content:space-between}
  .muted{color:var(--sub)}
  .topbar{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
  .cardbox{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;max-width:100%}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--marigold-soft);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:1.5px solid var(--peacock);flex:none}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);z-index:50;animation:up .28s cubic-bezier(.2,.8,.2,1);max-height:80%;display:flex;flex-direction:column}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-pad{padding:22px 20px 26px}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:40;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#1f1f22;color:#fff;font-size:12.5px;padding:12px 16px;border-radius:12px;z-index:120;max-width:88%;text-align:center;line-height:1.4;box-shadow:var(--shadow-lg)}
  .spin{width:26px;height:26px;border:3px solid var(--saffron-soft);border-top-color:var(--saffron);border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
  @keyframes rot{to{transform:rotate(360deg)}}
  .fadein{animation:fi .4s ease}
  @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .filtchip{flex:none;padding:8px 14px;border-radius:20px;background:var(--field);font-size:12.5px;color:var(--sub);white-space:nowrap}
  [style*="overflow-x:auto"]{max-width:100%}
  .dishframe{position:relative}
  .dishframe .orbit{position:absolute;font-size:15px;animation:orbit 6s linear infinite;will-change:transform}
  @keyframes orbit{0%{transform:rotate(0deg) translateX(60px) rotate(0deg)}100%{transform:rotate(360deg) translateX(60px) rotate(-360deg)}}
  .marquee{overflow:hidden;white-space:nowrap}
  .marquee b{display:inline-block;padding-left:100%;animation:mq 12s linear infinite}
  @keyframes mq{to{transform:translateX(-100%)}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .bob{animation:bob 2.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .blink{animation:blink 1.4s steps(2,start) infinite}
  @keyframes blink{50%{opacity:.35}}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  /* --- feedback screen --- */
  .fb-hero{background:linear-gradient(150deg,#E8801C 0%,#C1272D 48%,#0C6B8F 100%);color:#fff;border-radius:0 0 32px 32px;padding:40px 24px 34px;text-align:center;position:relative;overflow:hidden}
  .fb-hero .sprinkle{position:absolute;font-size:16px;opacity:.5;animation:floaty 5s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(12deg)}}
  .fb-star{font-size:38px;cursor:pointer;transition:transform .15s;filter:grayscale(1) opacity(.4)}
  .fb-star.lit{filter:none;transform:scale(1.12)}
  .fb-star:active{transform:scale(1.3)}
  .fb-choice{flex:1;padding:16px 10px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center}
  .fb-choice:active{transform:translateY(1px)}
  .fb-choice.sel{border-color:var(--peacock);background:var(--peacock-soft);color:var(--peacock)}
  .shine{background:linear-gradient(90deg,#E8801C,#F5A623,#E8801C);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
  @keyframes shine{to{background-position:200% 0}}
  /* --- Mehfil: sophisticated Indian modal system --- */
  .mehfil-scrim{position:absolute;inset:0;background:rgba(30,10,14,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:130;animation:fade .25s}
  .mehfil-card{position:absolute;left:50%;top:50%;width:86%;max-width:362px;background:linear-gradient(180deg,#fffdf8,var(--ivory));border:1px solid var(--gold);border-radius:18px;z-index:131;overflow:hidden;box-shadow:0 26px 64px rgba(55,14,20,.42);animation:mfin .42s cubic-bezier(.2,.8,.2,1);transform:translate(-50%,-50%)}
  .mehfil-card::before{content:"";position:absolute;inset:5px;border:1px solid var(--gold-2);border-radius:13px;opacity:.55;pointer-events:none;z-index:2}
  @keyframes mfin{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .mandala{position:absolute;top:-42px;right:-42px;width:152px;height:152px;color:var(--gold);opacity:.09;animation:slowspin 60s linear infinite;pointer-events:none}
  .mandala.bl{top:auto;right:auto;bottom:-46px;left:-46px;opacity:.06;animation-direction:reverse;animation-duration:80s}
  @keyframes slowspin{to{transform:rotate(360deg)}}
  .mehfil-inner{position:relative;z-index:3;padding:27px 24px 24px;text-align:center}
  .mehfil-eyebrow{font-size:10px;letter-spacing:2.6px;text-transform:uppercase;color:var(--gold);font-weight:700}
  .mehfil-title{font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;font-size:22px;line-height:1.28;color:var(--maroon);margin-top:9px;font-weight:600;letter-spacing:.2px}
  .toran{width:124px;height:26px;margin:13px auto 3px;color:var(--gold);display:block}
  .mehfil-body{font-size:13.5px;line-height:1.66;color:#4a3a3d;margin-top:6px}
  .mehfil-body b{color:var(--maroon)}
  .mehfil-cta{margin-top:21px;width:100%;background:linear-gradient(135deg,var(--saffron),var(--terracotta));color:#fff;border-radius:12px;padding:14px 22px;font-size:14px;font-weight:700;letter-spacing:.3px;box-shadow:0 8px 20px rgba(188,90,60,.32);position:relative;overflow:hidden}
  .mehfil-cta:active{transform:translateY(1px)}
  .mehfil-cta::after{content:"";position:absolute;top:0;left:-55%;width:38%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:sweep 3.4s ease-in-out infinite}
  @keyframes sweep{0%{left:-55%}55%,100%{left:135%}}
  /* --- country sheet: rank badges + rationale banner --- */
  .cc-banner{position:sticky;top:0;z-index:2;background:linear-gradient(180deg,#fff9ec,#fdf3d9);border:1px solid var(--gold-2);color:var(--maroon);font-size:11.5px;font-weight:600;line-height:1.4;padding:9px 12px;border-radius:11px;margin:0 8px 8px;text-align:center}
  .cc-rank{flex:none;min-width:32px;text-align:left;font-size:11px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  .cc-rank-soon{color:#cfc7b4;font-weight:600}
  .cc-here{color:var(--gold);font-size:10.5px;font-weight:800;letter-spacing:.4px}
  .splash-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 22%,#0e3a44 0%,#12202b 55%,#1a1220 100%);color:#fff}
  .splash-mandala{position:absolute;top:50%;left:50%;width:min(115%,520px);height:min(115%,520px);transform:translate(-50%,-58%);color:var(--gold);opacity:.09;animation:slowspin 90s linear infinite;pointer-events:none}
  .zlogo{position:relative;display:flex;gap:1px;font-family:'Inter',system-ui,sans-serif;font-weight:900;font-size:clamp(56px,18vw,80px);line-height:.9;letter-spacing:-2px;filter:drop-shadow(0 6px 20px rgba(0,0,0,.35))}
  .zlogo span{display:inline-block;opacity:0;transform:translateY(18px) scale(.86);animation:zin .55s cubic-bezier(.2,.85,.25,1) forwards}
  @keyframes zin{to{opacity:1;transform:none}}
  .ztag{position:relative;margin-top:16px;font-size:10.5px;letter-spacing:3px;font-weight:600;color:var(--gold-2);opacity:0;animation:zin .5s ease .7s forwards}
  .addr-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0C6B8F 0%,#E8801C 62%,#F5A623 100%);color:#fff;padding:24px 20px 26px}
  .addr-mandala{position:absolute;top:-46px;right:-46px;width:150px;height:150px;color:#fff;opacity:.15;pointer-events:none;animation:slowspin 80s linear infinite}
  .addr-seam{height:4px;background:linear-gradient(90deg,var(--saffron),var(--marigold),var(--red),var(--peacock),var(--terracotta))}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.zlogo span,.ztag{opacity:1;transform:none}}

  /* ---- Page II : group map ticker ---- */
  .grp-ticker{flex:none;background:linear-gradient(90deg,var(--terracotta),var(--saffron));color:#fff;overflow:hidden;white-space:nowrap;font-size:12px;padding:8px 0;font-weight:700}
  .grp-ticker b{display:inline-block;padding-left:100%;animation:mq 20s linear infinite;font-weight:700}
  /* ---- group cards ---- */
  .grpcard{position:relative;border-radius:18px;overflow:hidden;color:#fff;padding:0;margin-top:14px;cursor:pointer;box-shadow:var(--shadow);min-height:112px;display:flex;flex-direction:column;justify-content:flex-end}
  .grpcard:active{transform:translateY(1px)}
  .grpcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.34) 100%);pointer-events:none}
  .gt-motifs{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .gt-motif{position:absolute;top:14px;font-size:26px;opacity:.5;animation:floaty 6s ease-in-out infinite}
  .grpcard-body{position:relative;z-index:2;padding:16px 16px 14px}
  .grpcard-eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:800;opacity:.92}
  .grpcard-name{font-family:Georgia,serif;font-size:21px;font-weight:700;margin-top:3px;line-height:1.15;text-shadow:0 1px 8px rgba(0,0,0,.25)}
  .grpcard-tag{font-size:12px;margin-top:4px;opacity:.95;line-height:1.35;max-width:88%}
  .grpcard-go{position:absolute;z-index:2;right:14px;bottom:14px;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.22);backdrop-filter:blur(3px);padding:6px 12px;border-radius:20px}
  /* ---- vibrant welcome burst ---- */
  .zw-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88%;max-width:372px;z-index:131;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,#E8801C 0%,#C1272D 46%,#0C6B8F 100%);box-shadow:0 26px 70px rgba(40,10,16,.5);animation:mfin .42s cubic-bezier(.2,.8,.2,1)}
  .zw-floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .zw-float{position:absolute;opacity:.5;animation:floaty 5.5s ease-in-out infinite}
  .zw-inner{position:relative;z-index:2;padding:26px 22px 24px;text-align:center;color:#fff}
  .zw-badge{display:inline-block;font-size:10px;letter-spacing:2.4px;font-weight:800;background:rgba(255,255,255,.2);padding:6px 12px;border-radius:20px}
  .zw-title{font-family:Georgia,serif;font-size:30px;line-height:1.12;font-weight:700;margin-top:14px;text-shadow:0 2px 12px rgba(0,0,0,.28)}
  .zw-sub{font-size:13px;line-height:1.6;opacity:.96;margin-top:12px}
  .zw-beats{text-align:left;margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .zw-beat{display:flex;gap:11px;align-items:flex-start;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:13px;padding:11px 12px;font-size:12.5px;line-height:1.45}
  .zw-num{flex:none;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--red);font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
  .zw-cta{margin-top:20px;width:100%;background:#fff;color:var(--red);border-radius:14px;padding:15px;font-size:15px;font-weight:800;box-shadow:0 10px 22px rgba(0,0,0,.2)}
  .zw-cta:active{transform:translateY(1px)}
  /* ---- group intro (themed) ---- */
  .gi-hero{position:relative;overflow:hidden;color:#fff;padding:30px 22px 34px}
  .gi-floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .gi-float{position:absolute;opacity:.42;animation:floaty 6.5s ease-in-out infinite}
  .gi-eyebrow{font-size:10.5px;letter-spacing:2px;font-weight:800;opacity:.95}
  .gi-title{font-family:Georgia,serif;font-size:30px;font-weight:700;margin-top:8px;line-height:1.12;text-shadow:0 2px 12px rgba(0,0,0,.3)}
  .gi-tag{font-size:13px;margin-top:8px;opacity:.96;line-height:1.4}
  .gi-motifrow{display:flex;gap:12px;margin-top:16px;font-size:26px}
  .gi-sect{margin-top:18px}
  .gi-sect-h{font-size:11.5px;font-weight:800;letter-spacing:.6px}
  .gi-sect-b{font-size:14px;line-height:1.66;color:var(--ink);margin-top:6px}
  .gi-sect-b b{color:var(--maroon)}
  .gi-uxnote{margin-top:18px;display:flex;gap:11px;align-items:flex-start;background:var(--ivory);border:1px solid var(--gold-2);border-radius:14px;padding:13px 14px;font-size:13px;line-height:1.55;color:#4a3a3d}
  /* ---- group dishes band + rec chooser ---- */
  .gd-band{display:flex;align-items:center;gap:12px;color:#fff;padding:14px 18px}
  .gd-band-m{font-size:26px;opacity:.85}
  .recopt{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;transition:all .15s}
  .recopt:active{transform:translateY(1px)}
  .recopt.sel{border-color:var(--peacock);background:var(--peacock-soft);box-shadow:0 6px 16px rgba(12,107,143,.16)}
  .recopt-t{font-size:14px;font-weight:800;margin-top:6px}
  .recopt-s{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.3}
  /* ---- dish detail extras ---- */
  .dd-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .dd-cell{background:var(--field);border-radius:12px;padding:11px 12px}
  .dd-k{font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--sub)}
  .dd-v{font-size:12.5px;font-weight:600;margin-top:4px;line-height:1.4}
  .dd-disagree{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px dashed var(--peacock);border-radius:11px;padding:10px 12px;font-size:12px;color:var(--peacock-deep);cursor:pointer;line-height:1.4}
  .dd-disagree:active{transform:translateY(1px)}
  .gi-story{margin-top:2px;background:var(--ivory);border-left:4px solid var(--saffron);border-radius:12px;padding:14px 16px}
  .gi-story-h{font-size:11.5px;font-weight:800;letter-spacing:1px}
  .gi-story-b{font-size:14px;line-height:1.72;color:var(--ink);margin-top:7px}
  .rp-warn{margin-top:16px;background:#fff6e6;border:1px solid #f2d48a;border-radius:13px;padding:12px 14px;font-size:12px;line-height:1.55;color:#8a5a00}
  .rp-opt{margin-top:14px;display:flex;gap:13px;align-items:center;background:#fff;border:1.6px solid var(--line);border-radius:16px;padding:15px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
  .rp-opt:active{transform:translateY(1px)}
  .rp-emoji{font-size:28px;flex:none}
  .rp-t{font-size:16px;font-weight:900}
  .rp-d{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5;font-style:italic}
  .rp-go{font-size:13px;font-weight:800;flex:none}
  .gd-lock{background:#2b2b2b;color:#fff;font-size:11.5px;padding:8px 16px;line-height:1.45}
  .gd-lock b{color:var(--marigold)}
  .gd-restart{background:var(--ivory);border:1px dashed var(--terracotta);border-radius:14px;padding:14px 15px}
  .rs-intro{background:var(--peacock-soft);border:1px solid #bfe0ea;border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.6;color:#0a4256}
  .rs-add{flex:none;background:var(--red);color:#fff;border-radius:11px;padding:9px 14px;font-size:13px;font-weight:800;cursor:pointer}
  .rs-add:active{transform:translateY(1px)}
  .waitbox{display:flex;align-items:center;gap:10px;justify-content:flex-start;background:var(--ivory);border:1px dashed var(--terracotta);border-radius:13px;padding:13px 14px;font-size:12.5px;color:var(--maroon);font-weight:700;line-height:1.45;text-align:left}
  .waitbox .spin{width:16px;height:16px;border-width:2px;flex:none}
  .rs-hint{margin:2px 16px 0;background:#fff6e6;border:1px solid #f2d48a;border-radius:12px;padding:11px 13px;font-size:12px;color:#8a5a00;line-height:1.5}
  .quizopts{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .quizopt{background:#fff;border:1.5px solid var(--gold-2);border-radius:13px;padding:13px 14px;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;line-height:1.4}
  .quizopt:active{transform:translateY(1px)}
  .quiz-fine{font-size:11.5px;color:var(--sub);margin-top:12px}
  .quiz-wrong{background:#fdeaea;border:1px solid #f2b8b8;color:#a12622;border-radius:11px;padding:10px 12px;font-size:12.5px;font-weight:700;line-height:1.45;margin-bottom:10px}
  .cart-lock{margin-top:16px;background:#2b2b2b;color:#fff;border-radius:14px;padding:14px 15px;font-size:12.5px;line-height:1.55}
  .cart-lock b{color:var(--marigold)}
  .cart-badge{position:absolute;top:-7px;right:-9px;min-width:16px;height:16px;padding:0 4px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.25)}

function makeRng(seed){let s=seed>>>0;return ()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function assignDishes(seed){
  const rng=makeRng(seed);
  RESTAURANTS.forEach(r=>{
    const count=5+Math.floor(rng()*16);
    const pool=DISHES.map(d=>d.id);
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    r.dishIds=pool.slice(0,count).sort((a,b)=>a-b);
  });
  DISHES.forEach(d=>{ if(!RESTAURANTS.some(r=>r.dishIds.includes(d.id))){ const r=RESTAURANTS[Math.floor(rng()*RESTAURANTS.length)]; r.dishIds.push(d.id); r.dishIds.sort((a,b)=>a-b);} });
}
function buildDishIndex(){const idx={};DISHES.forEach(d=>idx[d.id]=[]);RESTAURANTS.forEach(r=>r.dishIds.forEach(id=>idx[id].push(r.id)));return idx;}

/* ============================================================
   MEHFIL — sophisticated Indian modal + motifs
   Motifs are drawn geometrically (single-stroke) to stay refined
   rather than clip-art: a jaali/mandala watermark + a marigold toran.
   ============================================================ */
function mandalaSVG(){
  let petals="",spokes="";
  for(let i=0;i<12;i++){petals+=`<ellipse cx="50" cy="23" rx="4.6" ry="12" transform="rotate(${i*30} 50 50)"/>`;}
  for(let i=0;i<24;i++){spokes+=`<line x1="50" y1="50" x2="50" y2="34" transform="rotate(${i*15} 50 50)"/>`;}
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%"><g fill="none" stroke="currentColor" stroke-width="0.7">${spokes}<circle cx="50" cy="50" r="49"/><circle cx="50" cy="50" r="40"/><circle cx="50" cy="50" r="17"/><circle cx="50" cy="50" r="6"/>${petals}</g></svg>`;
}
function toranSVG(){
  const xs=[8,20,32,44,56,68,80,92]; let s=`<path d="M4 5 Q50 12 96 5" fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.55"/>`;
  xs.forEach((x,i)=>{const drop=(i%2?11:14);const y=5+drop;s+=`<line x1="${x}" y1="6" x2="${x}" y2="${y-2.8}" stroke="currentColor" stroke-width="0.5" opacity="0.5"/><circle cx="${x}" cy="${y}" r="2.5" fill="currentColor" opacity="0.9"/><circle cx="${x}" cy="${y}" r="1" fill="#fffdf8" opacity="0.8"/>`;});
  return `<svg viewBox="0 0 100 22" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">${s}</svg>`;
}
function closeMehfil(){["mfscrim","mfcard"].forEach(id=>{const e=document.getElementById(id);if(e)e.remove();});}
function mehfilModal(o){
  closeMehfil();
  const scrim=document.createElement("div");scrim.className="mehfil-scrim";scrim.id="mfscrim";
  const card=document.createElement("div");card.className="mehfil-card";card.id="mfcard";
  card.innerHTML=`<div class="mandala">${mandalaSVG()}</div><div class="mandala bl">${mandalaSVG()}</div>
    <div class="mehfil-inner">
      ${o.eyebrow?`<div class="mehfil-eyebrow">${o.eyebrow}</div>`:""}
      <div class="mehfil-title">${o.title}</div>
      <div class="toran">${toranSVG()}</div>
      <div class="mehfil-body">${o.body}</div>
      <button class="mehfil-cta" id="mfcta">${o.cta||"Got it"}</button>
    </div>`;
  const ph=document.getElementById("phone");ph.appendChild(scrim);ph.appendChild(card);
  const done=()=>{closeMehfil();if(o.onClose)o.onClose();};
  card.querySelector("#mfcta").onclick=()=>{tap();done();};
  if(o.dismissible!==false)scrim.onclick=done;
}

const ADDR_LABELS={a:"Flat / House no.",b:"Building / Street",c:"Area / Landmark",d:"PIN code"};
function checkAddrField(f){
  const v=(M.user.addr[f]||"");
  if(v.length===0)return;                 // empty = not filled yet, don't nag
  if(f==="d"){ if(v.length>0&&v.length<6) fieldNudge("d",v.length); return; }
  if(v.length<6) fieldNudge(f,v.length);
}
function fieldNudge(f,n){
  const isPin=f==="d";
  mehfilModal({
    eyebrow:"Almost there",
    title:isPin?"Your PIN looks short":"Just a little more",
    body:isPin
      ? `A PIN code has exactly <b>6 digits</b>. You've entered <b>${n}</b> so far — a few more and you're set.`
      : `The <b>${ADDR_LABELS[f]}</b> field needs at least <b>6 characters</b>. You've entered <b>${n}</b>. Please add a little more so we can find you. 🙏`,
    cta:"Okay"
  });
}

function saveAddress(){
  tap();

  nav("groups");
}

function search(){

    <div style="flex:1;margin:0 10px;display:flex;align-items:center;gap:8px;background:var(--field);border-radius:12px;padding:11px 13px"><span>🔍</span><input id="sq" class="field" style="padding:0;background:transparent;font-size:14px" placeholder="Search any dish — try 'biryani'" onkeydown="if(event.key==='Enter')runSearch()" /></div>${avatar()}</div>
  <div style="padding:14px 18px 4px"><button class="btn" onclick="runSearch()">Search</button><div id="smsg" style="font-size:13px;margin-top:12px;min-height:18px"></div><div id="sresults" style="margin-top:6px"></div></div>`;
  document.getElementById("sq").focus?.();
}
function runSearch(){
  tap();
  const q=(document.getElementById("sq").value||"").trim().toLowerCase();
  const msg=document.getElementById("smsg"),box=document.getElementById("sresults");box.innerHTML="";
  if(!q){msg.style.color="var(--sub)";msg.textContent="Type something first.";return;}
  msg.innerHTML=`<span class="spin" style="width:14px;height:14px;border-width:2px"></span> Searching…`;
  setTimeout(()=>{
    M.searchAttempt++;
    if(M.searchAttempt===1){msg.style.color="var(--red)";msg.innerHTML=`😅 Oops! Search hiccuped and couldn't fetch results. Please tap Search once more.`;return;}
    const id=resolveDish(q);
    if(id===null){
      const sugg=suggest(q);
      msg.style.color="var(--red)";msg.innerHTML=`🤔 We couldn't find “${escapeHtml(q)}”.`;
      box.innerHTML=`${sugg.length?`<div style="font-size:12.5px;color:var(--sub);margin:8px 0 6px">Did you mean:</div><div style="display:flex;gap:8px;flex-wrap:wrap">${sugg.map(s=>`<span class="pill" onclick="document.getElementById('sq').value='${s}';runSearch()">${s}</span>`).join("")}</div>`:""}<button class="btn btn-outline" style="margin-top:14px" onclick="nav('options')">Browse all dishes instead</button>`;
      return;
    }
    const d=dishById(id);const restos=M.dishIndex[id];
    msg.style.color="var(--green)";msg.innerHTML=`Found it — served here as “${d.quirky}”. (${d.real})`;
    box.innerHTML=`<div class="cardbox fadein" onclick="pickDish(${id})" style="margin-top:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer">${orbitTile(d.emoji,56)}<div style="flex:1"><div style="font-size:14px;font-weight:700">${d.quirky}</div><div style="font-size:12px;color:var(--sub);margin-top:2px">Available at ${restos.length} place${restos.length>1?'s':''} · tap to choose</div></div><span style="color:var(--sub)">›</span></div>`;
  },1300);
}
function resolveDish(q){
  if(DISH_DICT.hasOwnProperty(q))return DISH_DICT[q];
  for(const k in DISH_DICT){if(k.includes(q)||q.includes(k))return DISH_DICT[k];}
  for(const d of DISHES){if(d.real.toLowerCase().includes(q)||d.quirky.toLowerCase().includes(q))return d.id;}
  return null;
}
function suggest(q){const keys=Object.keys(DISH_DICT);const scored=keys.map(k=>[k,sim(k,q)]).sort((a,b)=>b[1]-a[1]);return [...new Set(scored.filter(s=>s[1]>0).slice(0,4).map(s=>s[0]))];}
function sim(a,b){const A=new Set(a.replace(/\s/g,"")),B=new Set(b.replace(/\s/g,""));let c=0;A.forEach(x=>{if(B.has(x))c++;});return c;}
function escapeHtml(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}

const BIGMAC=["Switzerland","Argentina","Uruguay","Norway","Costa Rica","United States","United Kingdom","Sweden","Denmark","Canada","Turkey","Poland","Singapore","Colombia","Saudi Arabia","UAE","Australia","New Zealand","Israel","Mexico","Czechia","Chile","Kuwait","Peru","Bahrain","Nicaragua","Honduras","Qatar","Brazil","Thailand","Guatemala","Oman","South Korea","Pakistan","Azerbaijan","Hungary","Jordan","Moldova","China","Romania","Japan","Hong Kong","Vietnam","Malaysia","Philippines","Ukraine","South Africa","Egypt","India","Indonesia","Taiwan"];

function buildCCOrder(){
  const rank={}; BIGMAC.forEach((n,i)=>rank[n]=i+1);
  const ranked=[],tail=[];
  COUNTRIES.forEach((c,idx)=>{ if(rank[c[2]]) ranked.push({idx,rank:rank[c[2]]}); else tail.push({idx,rank:0}); });
  ranked.sort((a,b)=>a.rank-b.rank);
  return ranked.concat(tail);
}

/* ---- forced-wait reveal: hide the next-step control until N seconds pass ---- */
function gateReveal(waitId,btnId,seconds){
  var w=document.getElementById(waitId),b=document.getElementById(btnId);
  if(!w||!b) return;
  b.style.display="none";
  var remain=seconds;
  var line=function(n){return '<div class="waitbox"><span class="spin"></span><span class="waitt">Patience — unlocking in '+n+'s… keep reading, that’s the whole point 📖</span></div>';};
  w.innerHTML=line(remain);
  var iv=setInterval(function(){
    var wt=document.getElementById(waitId);
    if(!wt){clearInterval(iv);return;}
    remain--;
    if(remain>0){ wt.innerHTML=line(remain); }
    else{ clearInterval(iv); var wf=document.getElementById(waitId),bf=document.getElementById(btnId); if(wf)wf.style.display="none"; if(bf)bf.style.display=""; }
  },1000);
}
